<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link
      href="https://fonts.googleapis.com/css?family=Megrim|Nunito+Sans:400,900"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="https://emojipedia-us.s3.dualstack.us-west-1.amazonaws.com/thumbs/240/apple/155/ear-of-maize_1f33d.png"
    />

    <title>NODE FARM</title>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: inherit;
      }

      html {
        font-size: 62.5%;
        box-sizing: border-box;
      }

      body {
        padding: 5rem 5rem 10rem;
        line-height: 1.7;
        font-family: "Nunito Sans", sans-serif;
        color: #555;
        min-height: 100vh;
        background: linear-gradient(to bottom right, #9be15d, #00e3ae);
      }

      h1 {
        font-family: "Megrim", sans-serif;
        font-size: 6rem;
        color: white;
        transform: skewY(-5deg);
        text-align: center;
        position: relative;
        word-spacing: 3px;
      }

      h1::before {
        content: "";
        display: block;
        height: 65%;
        width: 49%;
        position: absolute;
        top: 105%;
        left: 50%;
        background: linear-gradient(to bottom, #9be15d, #00e3ae);
        opacity: 0.8;
        z-index: -1;
        transform: skewY(370deg) translate(-50%, -50%);
      }

      .container {
        width: 100%;
        max-width: 95rem;
        margin: 0 auto;
      }

      .cards-container {
        margin-top: 8rem;
      }

      .card {
        background: white;
        box-shadow: 0 2rem 6rem 1rem rgba(0, 0, 0, 0.15);
        margin-bottom: 5rem;
        transform: skewX(-20deg);
        display: flex;
        transition: all 0.5s;
      }

      .card__emoji {
        font-size: 5.5rem;
        line-height: 1.2;
        padding: 1.5rem 6rem 0.5rem 1.5rem;
        letter-spacing: -4rem;
        transform: skewX(20deg);
      }

      .card__title-box {
        background: linear-gradient(to bottom, #9be15d, #00e3ae);
        margin-right: auto;
        display: flex;
        align-items: center;
        padding: 0 3rem;
      }

      .card__title {
        font-family: "Megrim", sans-serif;
        color: white;
        font-size: 3.25rem;
        transform: skewX(20deg);
      }

      .card__details {
        display: flex;
      }

      .card__detail-box {
        align-self: stretch;
        border-right: 1px solid #ddd;
        display: flex;
        align-items: center;
      }

      .card__detail-box:last-child {
        border: none;
      }

      .card__detail {
        font-weight: 400;
        font-size: 1.8rem;
        transform: skewX(20deg);
        padding: 1.75rem;
      }

      .card__detail--organic {
        font-weight: 900;
        text-transform: uppercase;
        font-size: 1.9rem;
        background-image: linear-gradient(to right, #9be15d, #00e3ae);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .card__detail--price {
        font-weight: 900;
        font-size: 1.9rem;
      }

      .card__link:link,
      .card__link:visited {
        flex: 0 0 auto;
        background-color: #79e17b;
        color: white;
        font-size: 1.6rem;
        font-weight: 900;
        text-transform: uppercase;
        text-decoration: none;
        padding: 2.5rem;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
      }

      .card__link:hover,
      .card__link:active {
        background-color: #9be15d;
      }

      .card__link span {
        transform: skewX(20deg);
      }

      .card:hover {
        transform: skewX(-20deg) scale(1.08);
        box-shadow: 0 3rem 8rem 2rem rgba(0, 0, 0, 0.15);
      }

      .emoji-left {
        font-size: 2rem;
        margin-right: 1rem;
      }

      .emoji-right {
        font-size: 2rem;
        margin-left: 1rem;
      }

      .not-organic {
        display: none;
      }
      /* ---------- Tablet (≤ 1024px) ---------- */
      @media (max-width: 1024px) {
        body {
          padding: 4rem 3rem 8rem;
        }

        h1 {
          font-size: 4.8rem;
        }

        .cards-container {
          margin-top: 6rem;
        }

        .card {
          margin-bottom: 4rem;
        }

        .card__emoji {
          font-size: 4.5rem;
          padding: 1rem 4rem 0.5rem 1rem;
        }

        .card__title-box {
          padding: 0 2rem;
        }

        .card__title {
          font-size: 2.6rem;
        }

        .card__detail {
          font-size: 1.5rem;
          padding: 1.25rem;
        }

        .card__detail--organic,
        .card__detail--price {
          font-size: 1.6rem;
        }

        .card__link:link,
        .card__link:visited {
          font-size: 1.4rem;
          padding: 2rem;
        }
      }

      /* ---------- Mobile (≤ 600px) ---------- */
      @media (max-width: 600px) {
        body {
          padding: 3rem 1.5rem 6rem;
        }

        h1 {
          font-size: 3.4rem;
          word-spacing: 0;
        }

        .cards-container {
          margin-top: 4rem;
        }

        /* Drop the skew and stack the card vertically */
        .card {
          flex-direction: column;
          transform: none;
          margin-bottom: 3rem;
          box-shadow: 0 1rem 3rem 0.5rem rgba(0, 0, 0, 0.15);
        }

        .card:hover {
          transform: none;
          box-shadow: 0 1rem 3rem 0.5rem rgba(0, 0, 0, 0.15);
        }

        /* Remove the counter-skews since the card is no longer skewed */
        .card__emoji,
        .card__title,
        .card__detail,
        .card__link span {
          transform: none;
        }

        .card__emoji {
          font-size: 4rem;
          padding: 1rem 2rem 0.5rem 1.5rem;
          background: #fafafa;
        }

        .card__title-box {
          margin-right: 0;
          padding: 1.25rem 2rem;
        }

        .card__title {
          font-size: 2.4rem;
        }

        /* Details become a wrapping row */
        .card__details {
          flex-wrap: wrap;
        }

        .card__detail-box {
          flex: 1 1 50%;
          border-right: none;
          border-bottom: 1px solid #ddd;
          justify-content: center;
        }

        .card__detail-box:last-child {
          border-bottom: none;
        }

        .card__detail {
          font-size: 1.5rem;
          padding: 1.25rem 1rem;
          text-align: center;
        }

        .card__link:link,
        .card__link:visited {
          padding: 1.75rem;
          width: 100%;
        }
      }

      /* ---------- Touch devices: no hover scale ---------- */
      @media (hover: none) {
        .card:hover {
          transform: skewX(-20deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🌽 Node Farm 🥦</h1>

      <div class="cards-container">{%CARDS%}</div>
    </div>
  </body>
</html>
